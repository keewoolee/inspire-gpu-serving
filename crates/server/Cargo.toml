[package]
name = "pir-server"
version = "0.1.0"
edition = "2021"
description = "PIR serving front: GPU generations with zero-downtime flips, a batch scheduler, and a small HTTP API (manifest / lookup / sidecar)"

[dependencies]
pir-backend-ffi = { path = "../backend-ffi", features = ["gpu"] }
pir-keyword = { path = "../keyword" }
pir-chain = { path = "../chain" }
tiny_http = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
fastrand = "2.0"

[dev-dependencies]
pir-client = { path = "../client" }
ureq = { version = "3.3", default-features = false, features = ["rustls", "json"] }

[[bin]]
name = "pir-server"
path = "src/main.rs"
