[package]
name = "pir-front"
version = "0.1.0"
edition = "2021"
description = "Thin switchable HTTP forwarder: clients keep one address while backend generations/machines swap roles behind it"

[dependencies]
tiny_http = "0.12"
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
clap = { version = "4.5", features = ["derive"] }

[[bin]]
name = "pir-front"
path = "src/main.rs"
